<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Private Dining Review</title>
    <style>
      :root {
        --bg: #f7f7f5;
        --panel: #ffffff;
        --fg: #1f2328;
        --muted: #646b73;
        --line: #d9dcdf;
        --accent: #1f5f8b;
        --mark: #ffe58f;
        --ok: #1f7a4d;
        --warn: #9a5b00;
        --bad: #b42318;
        --font: system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: ui-monospace, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181b;
          --panel: #1f2226;
          --fg: #e8eaed;
          --muted: #a2a8b0;
          --line: #34383d;
          --accent: #7fb6e0;
          --mark: #6b5a12;
          --ok: #6fcf9c;
          --warn: #e3b55a;
          --bad: #f08a90;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 var(--font);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      header h1 {
        font-size: 16px;
        margin: 0 12px 0 0;
      }
      .muted {
        color: var(--muted);
      }
      main {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr) minmax(0, 520px);
        height: calc(100vh - 56px);
      }
      nav {
        overflow-y: auto;
        border-right: 1px solid var(--line);
        background: var(--panel);
      }
      nav button {
        display: flex;
        justify-content: space-between;
        width: 100%;
        text-align: left;
        padding: 8px 12px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: none;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      nav button[aria-current="true"] {
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      .pill {
        font-size: 11px;
        padding: 0 6px;
        border-radius: 99px;
        border: 1px solid currentColor;
      }
      .done {
        color: var(--ok);
      }
      .todo {
        color: var(--muted);
      }
      section.pages {
        overflow-y: auto;
        padding: 16px;
      }
      section.form {
        overflow-y: auto;
        padding: 16px;
        border-left: 1px solid var(--line);
        background: var(--panel);
      }
      .page {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        margin-bottom: 14px;
      }
      .page h3 {
        margin: 0;
        padding: 8px 12px;
        font-size: 13px;
        border-bottom: 1px solid var(--line);
        word-break: break-all;
      }
      .page pre {
        margin: 0;
        padding: 12px;
        white-space: pre-wrap;
        word-wrap: break-word;
        font: 13px/1.55 var(--font);
        max-height: 60vh;
        overflow-y: auto;
      }
      mark {
        background: var(--mark);
        color: inherit;
        padding: 0 1px;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-weight: 600;
        font-size: 13px;
      }
      select,
      input[type="text"],
      input[type="number"],
      textarea {
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 5px 7px;
      }
      textarea {
        width: 100%;
        min-height: 60px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 4px;
        text-align: left;
        vertical-align: top;
      }
      td input[type="number"] {
        width: 64px;
      }
      td input[type="text"] {
        width: 100%;
        min-width: 110px;
      }
      .quote {
        font-size: 12px;
        color: var(--muted);
      }
      .row-added {
        background: color-mix(in srgb, var(--ok) 10%, transparent);
      }
      button.action {
        font: inherit;
        padding: 6px 12px;
        border-radius: 4px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: none;
        color: var(--accent);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      .error {
        color: var(--bad);
        font-size: 13px;
      }
      .empty {
        padding: 40px;
        text-align: center;
        color: var(--muted);
      }
      @media (max-width: 1000px) {
        main {
          grid-template-columns: 1fr;
          height: auto;
        }
        nav {
          max-height: 30vh;
        }
        section.form {
          border-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Private Dining Review</h1>
      <label class="muted" for="sheet" style="margin: 0; font-weight: 400"
        >Review sheet (eval/review/sheets/&lt;you&gt;.json):</label
      >
      <input id="sheet" type="file" accept="application/json" />
      <span id="who" class="muted"></span>
      <span id="progress" class="muted"></span>
      <button id="export" class="action" disabled>Export review CSV</button>
    </header>
    <main>
      <nav id="list" aria-label="Venues"></nav>
      <section class="pages" id="pages">
        <div class="empty">
          Open your review sheet to start. Read <b>INSTRUCTIONS.md</b> first.
        </div>
      </section>
      <section class="form" id="form"></section>
    </main>
    <script>
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id);
        let sheet = null;
        let state = {}; // venue_id -> { status, unclear_reason, hosts, rooms:[...], notes, seconds, done }
        let current = null;
        let openedAt = null;

        const store = {
          key: () => `pdf-review:${sheet.reviewer}`,
          load() {
            try {
              return JSON.parse(localStorage.getItem(this.key()) || "{}");
            } catch {
              return {};
            }
          },
          save() {
            try {
              localStorage.setItem(this.key(), JSON.stringify(state));
            } catch {
              /* storage unavailable: export often */
            }
          },
        };

        const escapeHtml = (s) =>
          s.replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        const NUMBER_WORDS =
          "(?:one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|fifteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred)";
        const NUMBERS = new RegExp(
          `\\b(\\d[\\d,]*|${NUMBER_WORDS}(?:[\\s-]+${NUMBER_WORDS})*)\\b`,
          "gi",
        );
        const highlight = (text) =>
          escapeHtml(text).replace(NUMBERS, "<mark>$1</mark>");

        function initialState(v) {
          const t = v.teacher;
          return {
            status: t.status,
            unclear_reason: t.unclear_reason || "",
            hosts: t.hosts_private_events,
            rooms: t.rooms.map((r) => ({
              name: r.room_name,
              seated: r.seated_max,
              standing: r.standing_max,
              min: r.min,
              quote: r.quote,
              origin: "teacher",
              correct: "",
              exists: "yes",
            })),
            notes: "",
            seconds: 0,
            done: false,
          };
        }

        function tick() {
          if (current && openedAt) {
            state[current].seconds += (Date.now() - openedAt) / 1000;
            openedAt = Date.now();
          }
        }

        function renderList() {
          $("list").innerHTML = "";
          let done = 0;
          for (const v of sheet.venues) {
            const s = state[v.venue_id];
            if (s.done) done++;
            const b = document.createElement("button");
            b.setAttribute("aria-current", String(v.venue_id === current));
            b.innerHTML = `<span>${escapeHtml(v.venue_id)}<br><small class="muted">${escapeHtml(v.name)}</small></span><span class="pill ${s.done ? "done" : "todo"}">${s.done ? "done" : "to do"}</span>`;
            b.onclick = () => open(v.venue_id);
            $("list").appendChild(b);
          }
          $("progress").textContent = `${done} of ${sheet.venues.length} done`;
        }

        function open(id) {
          tick();
          current = id;
          openedAt = Date.now();
          const v = sheet.venues.find((x) => x.venue_id === id);
          $("pages").innerHTML =
            `<p><b>${escapeHtml(v.name)}</b> · ${escapeHtml(v.address)} · ${escapeHtml(v.city)}<br>
      <a href="${escapeHtml(v.website)}" target="_blank" rel="noopener">Live site (reference only; label from the saved text)</a></p>
      <p class="muted">Event-booking links: ${v.external_event_links.length ? v.external_event_links.map(escapeHtml).join(", ") : "none"}</p>` +
            v.pages
              .map(
                (p, i) =>
                  `<div class="page"><h3>Page ${i + 1} · ${escapeHtml(p.kind)} · ${escapeHtml(p.url)}</h3><pre>${highlight(p.text)}</pre></div>`,
              )
              .join("");
          renderForm(v);
          renderList();
        }

        function renderForm(v) {
          const s = state[v.venue_id];
          const rows = s.rooms
            .map(
              (r, i) => `
      <tr class="${r.origin === "added" ? "row-added" : ""}">
        <td><input type="text" data-i="${i}" data-k="name" value="${escapeHtml(r.name || "")}" aria-label="Room name">
            ${r.quote ? `<div class="quote">“${escapeHtml(r.quote)}”</div>` : ""}</td>
        <td><input type="number" min="1" data-i="${i}" data-k="seated" value="${r.seated ?? ""}" aria-label="Seated max"></td>
        <td><input type="number" min="1" data-i="${i}" data-k="standing" value="${r.standing ?? ""}" aria-label="Standing max"></td>
        <td><input type="number" min="1" data-i="${i}" data-k="min" value="${r.min ?? ""}" aria-label="Minimum"></td>
        <td>${
          r.origin === "added"
            ? "<span class='pill done'>added</span>"
            : `
          <select data-i="${i}" data-k="correct" aria-label="Teacher room correct">
            <option value="" ${r.correct === "" ? "selected" : ""}>?</option>
            <option value="yes" ${r.correct === "yes" ? "selected" : ""}>correct</option>
            <option value="no" ${r.correct === "no" ? "selected" : ""}>fixed / wrong</option></select>`
        }
          <select data-i="${i}" data-k="exists" aria-label="Room exists">
            <option value="yes" ${r.exists === "yes" ? "selected" : ""}>room exists</option>
            <option value="no" ${r.exists === "no" ? "selected" : ""}>not a real room</option></select></td>
      </tr>`,
            )
            .join("");
          $("form").innerHTML = `
      <h2 style="margin-top:0;font-size:16px">${escapeHtml(v.venue_id)}${v.double ? ' <span class="pill">double-reviewed</span>' : ""}</h2>
      <label for="f-status">Venue status</label>
      <select id="f-status"><option value="labeled">labeled</option><option value="unclear">unclear</option></select>
      <input type="text" id="f-reason" placeholder="Why unclear?" value="${escapeHtml(s.unclear_reason)}" style="width:60%">
      <label for="f-hosts">Hosts private events</label>
      <select id="f-hosts"><option>yes</option><option>no</option><option>unknown</option></select>
      <span class="muted">Teacher said: ${escapeHtml(v.teacher.hosts_private_events)}</span>
      <label>Rooms <span class="muted" style="font-weight:400">(teacher's label; fix numbers, mark each row, add missing rooms)</span></label>
      <table><thead><tr><th>Room</th><th>Seated</th><th>Standing</th><th>Min</th><th>Check</th></tr></thead><tbody>${rows || ""}</tbody></table>
      ${s.rooms.length ? "" : '<p class="muted">The teacher found no rooms.</p>'}
      <div class="actions"><button class="action secondary" id="add">Add missing room</button></div>
      <p class="muted">Teacher: total seats ${v.teacher.total_seats ?? "—"}, minimum spend ${v.teacher.min_spend_usd ?? "—"}, info elsewhere: ${v.teacher.info_maybe_elsewhere ? "yes" : "no"}</p>
      <label for="f-notes">Notes</label><textarea id="f-notes">${escapeHtml(s.notes)}</textarea>
      <p id="f-error" class="error" role="alert"></p>
      <div class="actions"><button class="action" id="done">Mark done</button></div>`;
          $("f-status").value = s.status;
          $("f-hosts").value = s.hosts;
          $("f-status").onchange = (e) => {
            s.status = e.target.value;
            s.done = false;
            store.save();
          };
          $("f-reason").oninput = (e) => {
            s.unclear_reason = e.target.value;
            store.save();
          };
          $("f-hosts").onchange = (e) => {
            s.hosts = e.target.value;
            s.done = false;
            store.save();
          };
          $("f-notes").oninput = (e) => {
            s.notes = e.target.value;
            store.save();
          };
          $("form")
            .querySelectorAll("[data-i]")
            .forEach((el) => {
              el.addEventListener(
                el.tagName === "SELECT" ? "change" : "input",
                () => {
                  const r = s.rooms[Number(el.dataset.i)];
                  const k = el.dataset.k;
                  r[k] = ["seated", "standing", "min"].includes(k)
                    ? el.value === ""
                      ? null
                      : Math.round(Number(el.value))
                    : el.value;
                  s.done = false;
                  store.save();
                },
              );
            });
          $("add").onclick = () => {
            s.rooms.push({
              name: "",
              seated: null,
              standing: null,
              min: null,
              quote: "",
              origin: "added",
              correct: "added",
              exists: "yes",
            });
            store.save();
            renderForm(v);
          };
          $("done").onclick = () => {
            const problems = [];
            if (s.status === "unclear" && !s.unclear_reason.trim())
              problems.push("Give a reason for unclear.");
            s.rooms.forEach((r, i) => {
              if (r.origin === "teacher" && !r.correct)
                problems.push(
                  `Row ${i + 1}: mark the teacher's room correct or fixed.`,
                );
              if (r.exists === "yes" && !r.name.trim())
                problems.push(`Row ${i + 1}: room name is empty.`);
              if (r.exists === "yes" && r.seated == null && r.standing == null)
                problems.push(
                  `Row ${i + 1}: give a seated or standing figure, or mark it "not a real room".`,
                );
            });
            $("f-error").textContent = problems.join(" ");
            if (problems.length) return;
            tick();
            s.done = true;
            store.save();
            renderList();
            const next = sheet.venues.find((x) => !state[x.venue_id].done);
            if (next) open(next.venue_id);
          };
        }

        function csvCell(v) {
          const s = v == null ? "" : String(v);
          return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
        }

        $("export").onclick = () => {
          tick();
          store.save();
          const cols = [
            "venue_id",
            "reviewer",
            "venue_status",
            "unclear_reason",
            "hosts_private_events",
            "room_name",
            "seated_max",
            "standing_max",
            "min",
            "teacher_room_correct",
            "room_exists",
            "notes",
            "minutes_spent",
            "done",
          ];
          const lines = [cols.join(",")];
          for (const v of sheet.venues) {
            const s = state[v.venue_id];
            const base = [
              v.venue_id,
              sheet.reviewer,
              s.status,
              s.unclear_reason,
              s.hosts,
            ];
            const tail = [s.notes, (s.seconds / 60).toFixed(1), s.done ? 1 : 0];
            if (s.rooms.length === 0)
              lines.push(
                [...base, "", "", "", "", "", "", ...tail]
                  .map(csvCell)
                  .join(","),
              );
            for (const r of s.rooms)
              lines.push(
                [
                  ...base,
                  r.name,
                  r.seated,
                  r.standing,
                  r.min,
                  r.origin === "added" ? "added" : r.correct,
                  r.exists,
                  ...tail,
                ]
                  .map(csvCell)
                  .join(","),
              );
          }
          const blob = new Blob([lines.join("\n") + "\n"], {
            type: "text/csv",
          });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `review_${sheet.reviewer}.csv`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        };

        $("sheet").onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            sheet = JSON.parse(await file.text());
          } catch {
            alert("That file is not a review sheet.");
            return;
          }
          const saved = store.load();
          state = Object.fromEntries(
            sheet.venues.map((v) => [
              v.venue_id,
              saved[v.venue_id] || initialState(v),
            ]),
          );
          $("who").textContent = `Reviewer: ${sheet.reviewer}`;
          $("export").disabled = false;
          open(
            (
              sheet.venues.find((v) => !state[v.venue_id].done) ||
              sheet.venues[0]
            ).venue_id,
          );
        };
        setInterval(() => {
          if (sheet) {
            tick();
            store.save();
          }
        }, 15000);
      })();
    </script>
  </body>
</html>
